spring.application.name=PulseGuardServerAPI

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── MySQL DataSource ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3307/pulseguard?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=pulseguard_user
spring.datasource.password=pulseguard_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# "update" creates/alters tables automatically on startup. Use "create-drop" for a clean start.
# Temporarily set to "create" to rebuild tables with VARCHAR UUIDs.
# After first successful startup, change back to "update".
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Secret must be at least 32 characters for HMAC-SHA256.
pulseguard.jwt.secret=PulseGuardSecretKeyForJwtTokenSigningMustBe32Chars!
# 24 hours in milliseconds
pulseguard.jwt.expiration-ms=86400000

# ─── Jackson ─────────────────────────────────────────────────────────────────
# Date/time format is configured in JacksonConfig.java (Jackson 3 / Spring Boot 4
# removed WRITE_DATES_AS_TIMESTAMPS from SerializationFeature).

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.personal.pulseguardserverapi=DEBUG
logging.level.org.springframework.security=WARN
